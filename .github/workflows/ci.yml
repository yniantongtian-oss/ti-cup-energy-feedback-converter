name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-protocol:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Verify imported sources
        run: python scripts/verify_sources.py
      - name: Test frame and telemetry integration
        run: python -m unittest discover -s tests -v
      - name: Exercise read-only telemetry request
        run: python examples/host/converter_telemetry.py request
  portable-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Configure
        run: cmake -S firmware -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Run host demo (Unix)
        if: runner.os != 'Windows'
        run: ./build/converter_demo > demo.csv
      - name: Run host demo (Windows)
        if: runner.os == 'Windows'
        run: .\build\Release\converter_demo.exe | Out-File -Encoding utf8 demo.csv
      - name: Run dependency-free simulation
        run: python simulation/simulate.py --duration 0.1 --output simulation/output.csv
