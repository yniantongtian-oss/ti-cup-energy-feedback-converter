name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-protocol:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Verify imported sources
        run: python scripts/verify_sources.py
      - name: Test host tools, control twin, and telemetry
        run: python -m pytest
      - name: Exercise read-only telemetry request
        run: python examples/host/converter_telemetry.py request
      - name: Exercise tuning CLI
        run: python simulation/tune.py run --duration 0.05 --output-dir simulation/runs/ci --json
  portable-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure
        run: cmake -S firmware -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Run host demo (Unix)
        if: runner.os != 'Windows'
        run: ./build/converter_demo > demo.csv
      - name: Run host demo (Windows)
        if: runner.os == 'Windows'
        run: .\build\Release\converter_demo.exe | Out-File -Encoding utf8 demo.csv
      - name: Run dependency-free simulation
        run: python simulation/simulate.py --duration 0.1 --output simulation/output.csv
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install analyzers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cppcheck clang-tidy
      - name: Run cppcheck and clang-tidy
        run: bash scripts/static_analysis.sh
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install coverage tools
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Python branch coverage
        run: python -m pytest --cov=simulation --cov=examples --cov=tools --cov-fail-under=85
      - name: Configure instrumented C tests
        env:
          CC: gcc
        run: cmake -S firmware -B build-coverage -DCMAKE_BUILD_TYPE=Debug -DCONVERTER_ENABLE_COVERAGE=ON
      - name: Build and run C tests
        run: cmake --build build-coverage --parallel && ctest --test-dir build-coverage --output-on-failure
      - name: C line coverage
        run: python -m gcovr --root . --object-directory build-coverage --filter firmware/src --exclude firmware/src/demo.c --fail-under-line 90 --txt --print-summary
